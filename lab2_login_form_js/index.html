<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form JS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="wrapper">
        <form class="login-form" id="loginForm">
            <h1 class="title">Login</h1>

            <fieldset class="group">
                <legend>Personal Information</legend>

                <label for="firstName">First Name:</label>
                <input type="text" id="firstName" class="user-name" placeholder="Artem" required>

                <label for="lastName">Last Name:</label>
                <input type="text" id="lastName" placeholder="Kolisnyk" required>

                <label for="email">Gmail:</label>
                <input type="email" id="email" placeholder="example@gmail.com" required>

                <label for="password">Password:</label>
                <input type="password" id="password" placeholder="••••••••" required>

                <label class="show-pass">
                    <input type="checkbox" id="showPassword">
                    Show password
                </label>
            </fieldset>

            <button type="submit" class="btn">Submit</button>
        </form>
    </main>

    <!-- Pop-up вікно -->
    <div class="pop-up hidden">
        <div class="pop-up__window">
            <button class="close-button" aria-label="close">&times;</button>
            <h2>Success</h2>
            <p>Registration successful!</p>
            <div class="letters"></div>
            <p class="info"></p>
            <button class="btn close">Close</button>
        </div>
    </div>

    <!-- type="module" дозволяє використовувати import / export -->
    <script type="module" src="index.js"></script>
</body>
</html>
